<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackbox Autonomous Defense Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Blackbox Air-Gapped Security Dashboard</h1>
        <div class="status-box">
            <p>System Status: <span id="status" class="green">PROTECTED</span></p>
            <p>Threat Engine: <span class="green">xInfer Essential Active</span></p>
        </div>
        <h2>Live Active Mitigation Stream</h2>
        <table id="threatTable">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Source IP</th>
                    <th>Threat Score</th>
                    <th>Action Taken</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>12:00:01</td>
                    <td>192.168.1.250</td>
                    <td>0.94</td>
                    <td class="red">eBPF XDP Dropped</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
